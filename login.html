<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WEYOURFEED</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0A0A0A 0%, #1a1a2e 50%, #0F0F1F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Fondo animado */
        .bg-blur {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,102,0,0.1) 0%, transparent 70%);
            animation: floatBg 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(20, 20, 32, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 102, 0, 0.2);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 102, 0, 0.4);
            box-shadow: 0 35px 70px rgba(255, 102, 0, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6600 0%, #FF8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.5rem;
            animation: slideIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            color: #FF6600;
            font-weight: 600;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(30, 30, 45, 0.8);
            border: 1.5px solid rgba(255, 102, 0, 0.2);
            border-radius: 12px;
            color: #FFF;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #FF6600;
            background: rgba(30, 30, 45, 0.95);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #FF6600 0%, #FF8800 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
            animation: slideIn 0.6s ease-out 0.3s both;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 102, 0, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 102, 0, 0.1);
            color: #FF6600;
            border: 1.5px solid #FF6600;
            margin-top: 0.75rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 102, 0, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            opacity: 0.5;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            padding: 0 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .toggle-mode button {
            background: none;
            border: none;
            color: #FF6600;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .toggle-mode button:hover {
            color: #FF8800;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86EFAC;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #FF6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            color: #FFF;
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-top: 0.75rem;
            animation: slideIn 0.6s ease-out 0.4s both;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>🔐 ADMIN</h1>
                <p>WEYOURFEED</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">📧 Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">🔑 Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">Ingresar</button>
            </form>

            <!-- SIGNUP FORM (oculto) -->
            <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">👤 Nombre</label>
                    <input type="text" id="signupName" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">📧 Email</label>
                    <input type="email" id="signupEmail" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">🔑 Contraseña</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" class="btn" id="signupBtn">Crear Cuenta</button>
            </form>

            <div class="divider">
                <span>O</span>
            </div>

            <button class="google-btn" onclick="handleGoogleLogin()">
                🔵 Continuar con Google
            </button>

            <div class="toggle-mode">
                <span id="toggleText">¿No tienes cuenta?</span>
                <button type="button" id="toggleBtn" onclick="toggleMode()">Crear una</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <script>
        let db;

        async function initFirebase() {
            const response = await fetch('/api/firebase-config');
            const config = await response.json();
            if (firebase.apps.length === 0) firebase.initializeApp(config);

            // Verificar si ya está autenticado
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    window.location.href = '/admin.html';
                }
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = '✅ ' + message;
            successDiv.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>';

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                showSuccess('Ingresando...');
                setTimeout(() => window.location.href = '/admin.html', 1000);
            } catch (error) {
                showError(error.message);
                btn.disabled = false;
                btn.innerHTML = 'Ingresar';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            const btn = document.getElementById('signupBtn');

            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>';

            try {
                const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
                await result.user.updateProfile({ displayName: name });
                showSuccess('Cuenta creada. Ingresando...');
                setTimeout(() => window.location.href = '/admin.html', 1500);
            } catch (error) {
                showError(error.message);
                btn.disabled = false;
                btn.innerHTML = 'Crear Cuenta';
            }
        }

        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await firebase.auth().signInWithPopup(provider);
                showSuccess('Google login exitoso. Ingresando...');
                setTimeout(() => window.location.href = '/admin.html', 1000);
            } catch (error) {
                showError(error.message);
            }
        }

        function toggleMode() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                toggleText.textContent = '¿No tienes cuenta?';
                toggleBtn.textContent = 'Crear una';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                toggleText.textContent = '¿Ya tienes cuenta?';
                toggleBtn.textContent = 'Ingresa aquí';
            }
        }

        initFirebase();
    </script>
</body>
</html>
