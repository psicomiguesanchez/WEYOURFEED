<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>WEYOURFEED - Catálogo de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
        }

        .headline {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-style: italic;
        }

        .logo-text {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 2px;
        }

        .logo-we { color: #FF6600; text-shadow: 0 0 20px #FF6600; }
        .logo-your { color: #FFFFFF; }
        .logo-feed { color: #FF6600; text-shadow: 0 0 20px #FF6600; }

        .glass {
            background: rgba(19, 19, 19, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 102, 0, 0.2);
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 102, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: rgba(255, 102, 0, 0.8);
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
            transform: translateY(-5px);
        }

        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease-in-out;
        }

        .notification.error {
            background: #EF4444;
            color: white;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 102, 0, 0.2);
            border-top-color: #FF6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-admin {
            background: linear-gradient(135deg, #0084ff 0%, #005fd4 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-admin:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 132, 255, 0.4);
        }
    </style>
</head>
<body>
    <!-- Notificación de mantenimiento -->
    <div id="maintenanceNotif" style="position: fixed; top: 20px; right: 20px; background: #FF6600; color: #000; padding: 16px 24px; border-radius: 8px; font-weight: bold; z-index: 9999; box-shadow: 0 4px 12px rgba(255, 102, 0, 0.4); cursor: pointer; max-width: 300px;" onclick="this.style.display='none';">
      ⚠️ En mantenimiento - Algunos elementos pueden no estar actualizados
    </div>

    <!-- Header -->
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <span class="logo-text">
                <span class="logo-we">WE</span><span class="logo-your">YOUR</span><span class="logo-feed">FEED</span>
            </span>
            <button onclick="toggleCart()" class="relative">
                <span class="text-2xl">🛒</span>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-orange-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <h1 class="headline text-4xl mb-2">Catálogo WEYOURFEED</h1>
        <p class="text-gray-400 mb-6">Descubre nuestros productos disponibles</p>

        <!-- Búsqueda y filtros -->
        <div class="flex gap-4 mb-6">
            <input type="text" id="clientSearch" placeholder="Buscar por nombre..." class="flex-1 bg-gray-900 border-2 border-orange-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-400" oninput="filterClientProducts()">
            <select id="clientCategory" class="w-44 bg-gray-900 border-2 border-orange-600 rounded-lg px-4 py-2 text-white focus:outline-none" onchange="filterClientProducts()">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <!-- Grid de productos -->
        <div id="clientGrid" class="grid-products">
            <div class="col-span-full text-center py-12">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-gray-400">Cargando catálogo...</p>
            </div>
        </div>
    </div>

    <!-- CARRITO MODAL -->
    <div id="cartModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000;" onclick="if(event.target.id==='cartModal') toggleCart()">
        <div style="position:absolute; right:0; top:0; width:400px; height:100%; background:#0A0A0A; border-left:2px solid #FF6600; overflow-y:auto; display:flex; flex-direction:column;">
            <!-- Header -->
            <div style="padding:20px; border-bottom:1px solid #FF6600; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="color:#FF6600; font-size:20px; font-weight:bold;">🛒 Carrito</h2>
                <button onclick="toggleCart()" style="background:none; border:none; color:#FF6600; font-size:24px; cursor:pointer;">✕</button>
            </div>

            <!-- Items -->
            <div id="cartItems" style="flex:1; padding:20px; overflow-y:auto;">
                <p style="color:#888; text-align:center;">Carrito vacío</p>
            </div>

            <!-- Total -->
            <div style="padding:20px; border-top:1px solid #FF6600; background:rgba(255,102,0,0.1);">
                <div style="color:#FFF; font-size:18px; margin-bottom:15px;">
                    <strong>Total:</strong> <span id="cartTotal" style="color:#FF6600; font-size:24px;">$0</span>
                </div>

                <!-- Formulario Cliente -->
                <div style="margin-bottom:15px; max-height:400px; overflow-y:auto;">
                    <p style="color:#FF6600; font-weight:bold; margin-bottom:10px; font-size:14px;">📋 Datos Personales</p>
                    <input type="text" id="clientName" placeholder="Nombre completo" style="width:100%; padding:8px; margin-bottom:8px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">
                    <input type="email" id="clientEmail" placeholder="Email" style="width:100%; padding:8px; margin-bottom:8px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">
                    <input type="tel" id="clientPhone" placeholder="Celular" style="width:100%; padding:8px; margin-bottom:15px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">

                    <p style="color:#FF6600; font-weight:bold; margin-bottom:10px; font-size:14px;">🏠 Datos de Envío</p>
                    <input type="text" id="clientCity" placeholder="Ciudad" style="width:100%; padding:8px; margin-bottom:8px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">
                    <input type="text" id="clientAddress" placeholder="Dirección" style="width:100%; padding:8px; margin-bottom:8px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">
                    <input type="text" id="clientBarrio" placeholder="Barrio o Conjunto" style="width:100%; padding:8px; margin-bottom:8px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">
                    <input type="text" id="clientNumero" placeholder="Número de casa o Apto" style="width:100%; padding:8px; margin-bottom:15px; background:#1a1a1a; border:1px solid #FF6600; border-radius:6px; color:#FFF; font-size:13px;">

                    <p style="color:#FF6600; font-weight:bold; margin-bottom:10px; font-size:14px;">📱 Preferencias</p>
                    <label style="display:flex; align-items:center; color:#FFF; font-size:13px; margin-bottom:10px;">
                        <input type="checkbox" id="clientPromo" style="margin-right:8px; width:16px; height:16px; cursor:pointer;">
                        <span>Recibir descuentos por celular y email</span>
                    </label>
                </div>

                <!-- Botón Pagar -->
                <button onclick="checkout()" style="width:100%; padding:12px; background:linear-gradient(135deg, #FF6600 0%, #FF8800 100%); color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">
                    Pagar con Wompi 💳
                </button>
            </div>
        </div>
    </div>

    <script>
        let db;
        let products = [];
        let categories = [];
        let lastRequestTime = 0;
        const REQUEST_THROTTLE_MS = 500;

        async function initializeFirebase() {
            try {
                // Limpiar datos de sesión de checkout (importante para mobile)
                sessionStorage.removeItem('orderReference');
                sessionStorage.removeItem('orderCart');
                sessionStorage.removeItem('orderCustomer');
                sessionStorage.removeItem('orderShipping');
                sessionStorage.removeItem('orderAmount');

                const response = await fetch('/api/firebase-config');
                if (!response.ok) throw new Error(`Config failed: ${response.status}`);
                const firebaseConfig = await response.json();

                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                console.log('✅ Firebase initialized (CLIENT)');
                loadProducts();
            } catch (error) {
                console.error('❌ Firebase init failed:', error);
                showNotification('Error cargando catálogo', 'error');
            }
        }

        async function loadProducts() {
            try {
                const now = Date.now();
                if (now - lastRequestTime < REQUEST_THROTTLE_MS) return;
                lastRequestTime = now;

                const productsSnap = await db.collection('productos').get();
                products = productsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const categoriesSnap = await db.collection('categorias').get();
                categories = categoriesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                renderProducts(products);
                updateCategoryFilter();
            } catch (error) {
                console.error('❌ Load failed:', error);
                showNotification('Error cargando productos', 'error');
            }
        }

        function renderProducts(filtered) {
            const grid = document.getElementById('clientGrid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-400">No hay productos disponibles</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const categoryName = categories.find(c => c.id === p.categoriaId)?.nombre || 'Sin categoría';
                const precio = p.precio ? parseInt(p.precio).toLocaleString('es-ES') : '0';

                return `
                    <div class="product-card">
                        <div style="height: 200px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                            ${p.imagenBase64 ? `<img src="${p.imagenBase64}" style="max-width: 100%; max-height: 100%; object-fit: contain;">` : '<p class="text-gray-500">Sin imagen</p>'}
                        </div>
                        <div class="p-4">
                            <p class="font-bold text-sm mb-2">${p.nombre || 'Sin nombre'}</p>
                            <div class="space-y-2 mb-3">
                                <div style="font-size:20px; color:#FF6600; font-weight:bold;">$${precio}</div>
                                <p class="text-gray-400 text-xs">${categoryName}</p>
                            </div>
                            <button onclick="addToCart('${p.id}')" style="width:100%; background:linear-gradient(135deg, #FF6600 0%, #FF8800 100%); color:#000; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px;">
                                🛒 Agregar al Carrito
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterClientProducts() {
            const searchTerm = document.getElementById('clientSearch').value.toLowerCase();
            const selectedCategory = document.getElementById('clientCategory').value;

            let filtered = products.filter(p => {
                const matchesSearch = p.nombre?.toLowerCase().includes(searchTerm);
                const matchesCategory = !selectedCategory || p.categoriaId === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            renderProducts(filtered);
        }

        function updateCategoryFilter() {
            const select = document.getElementById('clientCategory');
            select.innerHTML = '<option value="">Todas las categorías</option>' + categories.map(c =>
                `<option value="${c.id}">${c.nombre}</option>`
            ).join('');
        }

        function showNotification(message, type) {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // ============================================
        // CARRITO DE COMPRAS
        // ============================================
        let appCart = [];

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const cartItem = appCart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.cantidad++;
            } else {
                appCart.push({
                    id: product.id,
                    nombre: product.nombre,
                    precio: parseInt(product.precio) || 0,
                    cantidad: 1
                });
            }

            updateCartUI();
            showNotification(`✅ ${product.nombre} agregado al carrito`, 'success');
        }

        function removeFromCart(productId) {
            appCart = appCart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateQuantity(productId, quantity) {
            const item = appCart.find(i => i.id === productId);
            if (item) {
                item.cantidad = Math.max(1, parseInt(quantity));
                updateCartUI();
            }
        }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = appCart.length > 0 ? appCart.length : '0';

            const itemsDiv = document.getElementById('cartItems');
            if (appCart.length === 0) {
                itemsDiv.innerHTML = '<p style="color:#888; text-align:center;">Carrito vacío</p>';
                document.getElementById('cartTotal').textContent = '$0';
                return;
            }

            let total = 0;
            itemsDiv.innerHTML = appCart.map(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                return `
                    <div style="background:#1a1a1a; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #333;">
                        <div style="color:#FFF; font-weight:bold; margin-bottom:8px;">${item.nombre}</div>
                        <div style="color:#999; margin-bottom:8px;">$${item.precio.toLocaleString('es-ES')} ×
                            <input type="number" value="${item.cantidad}" min="1" onchange="updateQuantity('${item.id}', this.value)" style="width:50px; padding:4px; background:#0a0a0a; border:1px solid #FF6600; color:#FFF; border-radius:4px;">
                            = $${subtotal.toLocaleString('es-ES')}
                        </div>
                        <button onclick="removeFromCart('${item.id}')" style="background:#EF4444; color:#FFF; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px;">Eliminar</button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-ES');
        }

        async function checkout() {
            if (appCart.length === 0) {
                showNotification('❌ Carrito vacío', 'error');
                return;
            }

            // Datos personales
            const name = document.getElementById('clientName').value.trim();
            const email = document.getElementById('clientEmail').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();

            // Datos de envío
            const city = document.getElementById('clientCity').value.trim();
            const address = document.getElementById('clientAddress').value.trim();
            const barrio = document.getElementById('clientBarrio').value.trim();
            const numero = document.getElementById('clientNumero').value.trim();
            const promo = document.getElementById('clientPromo').checked;

            // Validaciones
            if (!name || !email || !phone || !city || !address || !barrio || !numero) {
                showNotification('❌ Completa todos los datos personales y de envío', 'error');
                return;
            }

            if (!email.includes('@')) {
                showNotification('❌ Email inválido', 'error');
                return;
            }

            try {
                const response = await fetch('/api/create-wompi-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cart: appCart,
                        customer: { name, email, phone },
                        shipping: { city, address, barrio, numero },
                        promo: promo
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Guardar datos temporales para la página de confirmación
                    sessionStorage.setItem('orderReference', data.reference);
                    sessionStorage.setItem('orderCart', JSON.stringify(appCart));
                    sessionStorage.setItem('orderCustomer', JSON.stringify({ name, email, phone }));
                    sessionStorage.setItem('orderShipping', JSON.stringify({ city, address, barrio, numero }));
                    sessionStorage.setItem('orderAmount', data.amount);

                    // Redirigir a Wompi
                    window.location.href = data.checkout_url;
                } else {
                    showNotification(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('❌ Error procesando pedido', 'error');
            }
        }

        initializeFirebase();
    </script>
</body>
</html>
